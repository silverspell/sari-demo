# Uçtan uca demo: telefon girişi -> OTP -> isim -> konum izni -> ana ekran ->
# hedef seçimi -> rota ve ücret -> çağrı -> sürücü -> yolculuk -> puanlama.
appId: tr.byteflow.sari
---
- launchApp:
    clearState: true
- assertVisible: 'Telefon numaranı gir'
- tapOn: '5xx xxx xx xx'
- inputText: '5551234567'
- assertVisible: '555 123 45 67'
- tapOn: 'Devam et'
- assertVisible: 'Kodu gir'
- tapOn:
    text: '•'
    index: 0
- inputText: '1'
- inputText: '2'
- inputText: '3'
- inputText: '4'
- tapOn: 'Doğrula'
- assertVisible: 'Seni nasıl çağıralım?'
- tapOn: 'Örn: Cem'
- inputText: 'Ayşe'
- tapOn: 'Örn: Güler'
- inputText: 'Yılmaz'
- tapOn: 'Devam et'
- assertVisible: 'Konumunu kullanalım'
- tapOn: 'Şimdi değil'
- assertVisible: 'Merhaba Ayşe'
- assertVisible: 'Nereye?'
- assertVisible: 'Taksi çağır'
- tapOn: 'Nereye?'
- assertVisible: 'Nereye gitmek istersiniz?'
- tapOn: 'Kadıköy İskele'
- assertVisible: 'Rota Ve Ücret Tahmini'
- assertVisible: 'Sarı Taksi'
- tapOn: 'Taksi Çağır'
- assertVisible: 'Taksi Aranıyor'
- extendedWaitUntil:
    visible: 'Sürücü Yolda'
    timeout: 10000
- extendedWaitUntil:
    visible: 'Yolculuk Başladı'
    timeout: 15000
- extendedWaitUntil:
    visible: 'Yolculuk Tamamlandı'
    timeout: 25000
- assertVisible: 'Yolculuğunu puanla'
- tapOn: '5 Yıldız'
- scrollUntilVisible:
    element:
      text: 'Bitir'
    direction: DOWN
    timeout: 10000
- tapOn: 'Bitir'
- assertVisible: 'Merhaba Ayşe'
- assertVisible: 'Nereye?'
# Ana ekrandan menüyü açıp Yolculuklarım ekranına geçiş.
- tapOn: 'Menüyü Aç'
- assertVisible: 'Yolculuklarım'
- tapOn: 'Yolculuklarım'
- assertVisible: 'Yolculuklarım'
- assertVisible: 'Bu Ayki Yolculuklar'
