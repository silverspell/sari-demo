<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100%;margin:0;padding:0;background-color:#f9f9f9;color:#1a1c1c;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,34px);}.pt-safe{padding-top:env(safe-area-inset-top,48px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-secondary-fixed":"#1c1b1b","primary-fixed-dim":"#f4bf00","surface-bright":"#f9f9f9","tertiary":"#006e2d","inverse-surface":"#2f3131","on-tertiary":"#ffffff","error-container":"#ffdad6","on-error":"#ffffff","on-background":"#1a1c1c","on-primary":"#ffffff","surface":"#f9f9f9","on-primary-fixed-variant":"#594400","on-secondary-fixed-variant":"#474646","surface-variant":"#e2e2e2","tertiary-fixed":"#72fe8f","on-primary-container":"#6e5500","inverse-on-surface":"#f1f1f1","on-primary-fixed":"#241a00","on-tertiary-fixed":"#002108","on-secondary-container":"#656464","surface-container-lowest":"#ffffff","secondary-container":"#e5e2e1","on-error-container":"#93000a","outline-variant":"#d2c5ab","error":"#ba1a1a","on-tertiary-container":"#006729","secondary-fixed-dim":"#c8c6c5","primary-fixed":"#ffdf92","outline":"#81765f","on-secondary":"#ffffff","on-tertiary-fixed-variant":"#005320","background":"#f9f9f9","tertiary-container":"#5dea7e","secondary-fixed":"#e5e2e1","surface-container-high":"#e8e8e8","surface-container":"#eeeeee","surface-container-low":"#f3f3f3","on-surface":"#1a1c1c","surface-tint":"#755b00","tertiary-fixed-dim":"#53e076","secondary":"#5f5e5e","on-surface-variant":"#4f4632","surface-dim":"#dadada","primary-container":"#ffc800","primary":"#755b00","inverse-primary":"#f4bf00","surface-container-highest":"#e2e2e2"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-md":"1rem","space-sm":"0.5rem","space-lg":"1.5rem",margin:"1rem","space-xs":"0.25rem","space-xl":"2rem",gutter:"1rem"},fontFamily:{"label-lg":["Inter"],"headline-lg":["Inter"],"body-md":["Inter"],"headline-xl":["Inter"],"body-sm":["Inter"],"label-md":["Inter"],"label-mono":["Inter"],"headline-md":["Inter"],"headline-xl-mobile":["Inter"],"headline-sm":["Inter"],"body-lg":["Inter"],"label-sm":["Inter"]},fontSize:{"label-lg":["16px",{lineHeight:"20px",fontWeight:"600"}],"headline-lg":["24px",{lineHeight:"30px",letterSpacing:"-0.015em",fontWeight:"700"}],"body-md":["14px",{lineHeight:"20px",fontWeight:"400"}],"headline-xl":["32px",{lineHeight:"38px",letterSpacing:"-0.02em",fontWeight:"700"}],"body-sm":["12px",{lineHeight:"16px",fontWeight:"400"}],"label-md":["14px",{lineHeight:"18px",fontWeight:"600"}],"label-mono":["13px",{lineHeight:"16px",letterSpacing:"0.04em",fontWeight:"700"}],"headline-md":["20px",{lineHeight:"26px",letterSpacing:"-0.01em",fontWeight:"600"}],"headline-xl-mobile":["28px",{lineHeight:"34px",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-sm":["17px",{lineHeight:"22px",letterSpacing:"-0.005em",fontWeight:"600"}],"body-lg":["16px",{lineHeight:"22px",fontWeight:"400"}],"label-sm":["12px",{lineHeight:"16px",fontWeight:"500"}]}}}}</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Nav Bar: Back Button -->
<div class="flex items-center justify-between pt-space-xs pb-space-sm">
<button aria-label="Geri dön" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[22px]">chevron_left</span>
</button>
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container rounded-full">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-secondary">SMS ile Doğrulama</span>
</div>
</div>
<!-- Primary Verification Flow -->
<div class="flex flex-col mt-space-sm">
<!-- Header Typography -->
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">Kodu gir</h1>
<p class="font-body-md text-body-md text-secondary mt-1">
<span class="font-label-md text-label-md text-on-surface">+90 532 123 45 67</span> numarasına gönderdik
    </p>
<!-- OTP Input Group (Interactive) -->
<div class="flex items-center justify-between gap-3 mt-space-lg" id="otp-container">
<input aria-label="1. hane" autocomplete="one-time-code" class="w-16 h-18 py-4 bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg text-center rounded-xl shadow-sm focus:bg-primary-container/20 focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text" value="8"/>
<input aria-label="2. hane" class="w-16 h-18 py-4 bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg text-center rounded-xl shadow-sm focus:bg-primary-container/20 focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text" value="4"/>
<input aria-label="3. hane" class="w-16 h-18 py-4 bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg text-center rounded-xl shadow-sm focus:bg-primary-container/20 focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" placeholder="•" type="text"/>
<input aria-label="4. hane" class="w-16 h-18 py-4 bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg text-center rounded-xl shadow-sm focus:bg-primary-container/20 focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" placeholder="•" type="text"/>
</div>
<!-- Resend Timer -->
<div class="flex items-center justify-center gap-1.5 mt-space-md text-center">
<span class="material-symbols-outlined text-[18px] text-secondary">update</span>
<p class="font-label-md text-label-md text-secondary" id="countdown-text">
        Kodu tekrar gönder (<span class="font-label-mono text-label-mono text-on-surface" id="countdown">0:28</span>)
      </p>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 bg-on-secondary-fixed text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-2 mt-space-lg shadow-md active:bg-inverse-surface transition-colors" type="button">
<span>Doğrula</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Divider & Showcase Title -->
<div class="flex items-center gap-3 my-space-xl">
<div class="flex-1 h-[1px] bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary">Durum Görünümü</span>
<div class="flex-1 h-[1px] bg-surface-container-high"></div>
</div>
<!-- Error State Demonstration Card -->
<div class="flex flex-col bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<div class="flex items-center justify-between pb-space-sm mb-space-sm">
<div class="flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-error"></span>
<span class="font-headline-sm text-headline-sm text-on-surface">Hata Durumu</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-error-container text-on-error-container font-label-sm text-label-sm">Geçersiz Kod</span>
</div>
<!-- Error OTP Input Boxes -->
<div class="flex items-center justify-between gap-3 my-space-xs">
<div class="w-16 h-18 py-4 bg-error-container/40 text-error font-headline-lg text-headline-lg text-center rounded-xl flex items-center justify-center shadow-inner">
        3
      </div>
<div class="w-16 h-18 py-4 bg-error-container/40 text-error font-headline-lg text-headline-lg text-center rounded-xl flex items-center justify-center shadow-inner">
        9
      </div>
<div class="w-16 h-18 py-4 bg-error-container/40 text-error font-headline-lg text-headline-lg text-center rounded-xl flex items-center justify-center shadow-inner">
        1
      </div>
<div class="w-16 h-18 py-4 bg-error-container/40 text-error font-headline-lg text-headline-lg text-center rounded-xl flex items-center justify-center shadow-inner">
        0
      </div>
</div>
<!-- Error Feedback Message -->
<div class="flex items-center gap-2 mt-space-sm px-3 py-2.5 bg-error-container text-on-error-container rounded-lg">
<span class="material-symbols-outlined text-[20px] text-error flex-shrink-0" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-label-md text-label-md text-error flex-1">
        Kod hatalı, tekrar dene.
      </p>
<button class="font-label-sm text-label-sm text-on-error-container underline font-semibold" type="button">Temizle</button>
</div>
<!-- Secondary Helper Prompt -->
<div class="flex items-center justify-between mt-space-md pt-space-xs">
<span class="font-body-sm text-body-sm text-secondary">Mesaj ulaşmadı mı?</span>
<button class="font-label-md text-label-md text-primary flex items-center gap-1 active:opacity-75" type="button">
<span class="material-symbols-outlined text-[16px]">call</span>
<span>Beni ara</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const inputs = document.querySelectorAll('#otp-container input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    let seconds = 28;
    const countEl = document.getElementById('countdown');
    if (countEl) {
      const timer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          const txt = document.getElementById('countdown-text');
          if (txt) {
            txt.innerHTML = '<button type="button" class="text-primary font-label-md underline">Kodu tekrar gönder</button>';
          }
        } else {
          countEl.textContent = '0:' + (seconds < 10 ? '0' : '') + seconds;
        }
      }, 1000);
    }
  })();
</script></main></body></html>
