<script>
  // Simple micro-interaction for map marker simulation
  (function() {
    const marker = document.getElementById('taxiMarker');
    if (!marker) return;
    let offset = 0;
    setInterval(() => {
      offset = (offset === 0) ? 4 : 0;
      marker.style.transform = `translate(-50%, calc(-50% + ${offset}px))`;
    }, 1200);

    const cancelBtn = document.getElementById('cancelRideBtn');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => {
        if (confirm('Yolculuğu iptal etmek istediğinizden emin misiniz?')) {
          history.back();
        }
      });
    }
  })();
